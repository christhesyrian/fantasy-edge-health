name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"

      - name: Format check
        run: ruff format --check src tests

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy

      - name: Test
        # -m "not live": the live marker hits real providers and must never
        # gate a pull request on someone else's uptime.
        run: pytest -q -m "not live" --cov=fhe --cov-report=term-missing

      - name: Migration drift
        # Fails if a model changed without a matching revision, which otherwise
        # only surfaces on a deploy.
        run: pytest -q tests/integration/test_migrations.py

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  integration:
    name: Integration (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fhe
          POSTGRES_PASSWORD: fhe
          POSTGRES_DB: fhe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fhe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"

      - name: Migrate
        run: alembic upgrade head
        env:
          FHE_DATABASE_URL: postgresql+asyncpg://fhe:fhe@localhost:5432/fhe

      - name: Test against real services
        # The suite also runs on SQLite in the `python` job. This one proves the
        # schema and queries work on the production engine, where JSONB, native
        # UUIDs, and stricter typing actually apply.
        run: pytest -q -m "integration and not live"
        env:
          FHE_DATABASE_URL: postgresql+asyncpg://fhe:fhe@localhost:5432/fhe
          FHE_REDIS_URL: redis://localhost:6379/0

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Python
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # Playwright starts uvicorn from ./.venv, so give it one.
          python -m venv .venv
          ./.venv/bin/pip install -e .

      - name: Install web
        working-directory: apps/web
        run: npm ci

      - name: Install browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end suite
        working-directory: apps/web
        # Demo mode needs no credentials and no ingested data, which is exactly
        # what makes this runnable in CI at all.
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -e .

      - name: Dependency vulnerabilities (Python)
        run: pip-audit --strict --progress-spinner off

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Dependency vulnerabilities (npm)
        working-directory: apps/web
        run: npm audit --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
