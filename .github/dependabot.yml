version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine patches keeps the review queue signal-to-noise high;
      # majors still arrive individually because they need real attention.
      python-patches:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-patches:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: "/services/api"
    schedule:
      interval: monthly
